# coturn — relays encrypted media when peers can't connect directly (and for "Hide my IP").
# It only ever sees DTLS-SRTP packets whose frames are additionally AES-256-GCM encrypted.
listening-port=3478
tls-listening-port=5349
realm=turn.wekonet.app
fingerprint
lt-cred-mech
user=wekonet:change-me
cert=/etc/letsencrypt/live/turn.wekonet.app/fullchain.pem
pkey=/etc/letsencrypt/live/turn.wekonet.app/privkey.pem
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
total-quota=200
stale-nonce=600
no-stdout-log
syslog
