name: Build WeKoNet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: 22
  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL || 'wss://wekonet-relay.onrender.com/ws' }}
  VITE_APP_BASE: ${{ vars.VITE_APP_BASE || 'https://wekonet.app/b/' }}
  VITE_TILE_URL: ${{ vars.VITE_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}
  VITE_ICE_SERVERS: ${{ secrets.VITE_ICE_SERVERS }}

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - name: Crypto, MITM and relay tests (real ML-KEM-768)
        run: npm test
      - run: npm run build
      - name: Enforce CSP / no inline script / no unsafe DOM sinks
        run: node scripts/check-csp.mjs
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-web, path: dist }

  android:
    needs: test-and-web
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK (if signing secrets are set)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out app/build/outputs/apk/release/WeKoNet-release.apk aligned.apk
          rm release.jks
      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/WeKoNet-android-debug.apk
          cp android/app/build/outputs/apk/release/WeKoNet-release.apk out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-android, path: out/*.apk }

  ios:
    needs: test-and-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:ios
      - name: Build unsigned IPA (sign with your Apple Developer account to install)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/WeKoNet.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log \
            || { echo "::error title=Xcode build failed::$(grep -E 'error:|BUILD FAILED' build.log | tail -n 25 | tr -d '\r' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          mkdir -p Payload && cp -R build/WeKoNet.xcarchive/Products/Applications/App.app Payload/
          zip -qr ../../WeKoNet-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-ios, path: WeKoNet-ios-unsigned.ipa }

  windows:
    needs: test-and-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - name: Package (win)
        shell: bash
        run: |
          # No signing certificate configured -> build unsigned (an empty CSC_LINK makes electron-builder fail)
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          set +e; npm run dist:win 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=Build failed::$(tail -n 60 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $s
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-windows, path: release/*.exe }

  raspberry-pi:
    needs: test-and-web
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - name: Package (pi)
        shell: bash
        run: |
          set +e; npm run dist:pi 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=Build failed::$(tail -n 60 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $s
      - uses: actions/upload-artifact@v4
        with:
          name: wekonet-raspberry-pi
          path: |
            release/*.AppImage
            release/*.deb

  linux-x64:
    needs: test-and-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm install --no-audit --no-fund
      - name: Package (linux)
        shell: bash
        run: |
          set +e; npm run dist:linux 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=Build failed::$(tail -n 60 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $s
      - uses: actions/upload-artifact@v4
        with:
          name: wekonet-linux-x64
          path: |
            release/*.AppImage
            release/*.deb

  relay-image:
    needs: test-and-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          push: true
          tags: ghcr.io/${{ env.OWNER }}/wekonet-relay:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, raspberry-pi, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: cd artifacts/wekonet-web && zip -qr ../../WeKoNet-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.ipa
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            WeKoNet-web.zip

