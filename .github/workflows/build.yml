name: Build WeKoNet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: 22
  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL || 'wss://wekonet-relay.onrender.com/ws' }}
  VITE_APP_BASE: ${{ vars.VITE_APP_BASE || 'https://wekonet-relay.onrender.com/b/' }}
  VITE_TILE_URL: ${{ vars.VITE_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}
  VITE_ICE_SERVERS: ${{ secrets.VITE_ICE_SERVERS }}

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - name: Crypto, MITM and relay tests (real ML-KEM-768)
        run: npm test
      - run: npm run build
      - name: Enforce CSP / no inline script / no unsafe DOM sinks
        run: node scripts/check-csp.mjs
      - name: Browser attack tests (3-person call, MITM relay, injection, outage, offline SOS)
        env:
          VITE_RELAY_URL: ws://127.0.0.1:8787/ws
          VITE_APP_BASE: http://127.0.0.1:5173/b/
          VITE_ICE_SERVERS: '[]'
        run: |
          npx vite build --outDir dist-e2e
          npx playwright install --with-deps chromium
          WEKONET_SITE=dist-e2e npm run test:e2e
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-web, path: dist }

  android:
    needs: test-and-web
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:android
      - name: Build release APK (not debuggable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            # No signing secrets: sign with a one-off key so the APK installs.
            # Add ANDROID_KEYSTORE_* secrets to keep one permanent key (needed for updates).
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a temporary key"
            KS_PASS=$(openssl rand -hex 24); KEY_PASS=$KS_PASS; KEY_ALIAS=wekonet
            keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" -keyalg EC -groupname secp384r1 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=WeKoNet, O=WeKoNet"
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../out
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "../out/WeKoNet-$VERSION-android.apk" aligned.apk
          $BT/apksigner verify --print-certs "../out/WeKoNet-$VERSION-android.apk"
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-android, path: out/*.apk }

  ios:
    needs: test-and-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:ios
      - name: Build unsigned IPA (sign with your Apple Developer account to install)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/WeKoNet.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload && cp -R build/WeKoNet.xcarchive/Products/Applications/App.app Payload/
          zip -qr ../../WeKoNet-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-ios, path: WeKoNet-ios-unsigned.ipa }

  windows:
    needs: test-and-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: wekonet-windows, path: release/*.exe }

  raspberry-pi:
    needs: test-and-web
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run dist:pi
      - uses: actions/upload-artifact@v4
        with:
          name: wekonet-raspberry-pi
          path: |
            release/*.AppImage
            release/*.deb

  linux-x64:
    needs: test-and-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: wekonet-linux-x64
          path: |
            release/*.AppImage
            release/*.deb

  relay-image:
    needs: test-and-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wekonet-relay:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, raspberry-pi, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: cd artifacts/wekonet-web && zip -qr ../../WeKoNet-web.zip .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.ipa
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            WeKoNet-web.zip
